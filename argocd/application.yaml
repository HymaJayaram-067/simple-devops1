apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: simple-devops-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/HymaJayaram-067/simple-devops.git
    targetRevision: feature-code
    path: k8s/
  destination:
    server: https://kubernetes.default.svc
    namespace: devops-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
